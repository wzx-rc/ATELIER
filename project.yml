name: Atelier
options:
  bundleIdPrefix: com.atelier
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  Atelier:
    type: application
    platform: iOS
    sources:
      - path: Atelier
    settings:
      base:
        PRODUCT_NAME: Atelier
        PRODUCT_BUNDLE_IDENTIFIER: com.atelier.photoapp
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Atelier
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Atelier enregistre vos images retouchées dans la photothèque."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Atelier ouvre les photos que vous choisissez."
        INFOPLIST_KEY_UIStatusBarHidden: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

schemes:
  Atelier:
    build:
      targets:
        Atelier: all
    run:
      config: Debug
    archive:
      config: Release
